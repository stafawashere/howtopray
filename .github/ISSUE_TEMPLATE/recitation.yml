name: Mistake in a recitation
description: Something in the Arabic, a transliteration or a meaning is wrong.
labels: [content]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Which version of the page is it on? Pick all if it's in the Arabic, since every page shares it.
      options:
        - All
        - English
        - Arabic
        - Urdu
        - Bengali
        - Indonesian
        - Turkish
        - French
    validations:
      required: true
  - type: input
    id: position
    attributes:
      label: Where on the page
      description: The position, or the rak'ah table.
      placeholder: 8, Final sitting and salam, in the full text of the tashahhud
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What it says now
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A hadith reference, a book or a scholar's page that I can check it against.
